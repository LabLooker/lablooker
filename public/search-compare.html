<!DOCTYPE html>
<html><head><title>Search Bar Comparison</title>
<style>
body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #faf8f5; color: #1a2e2b; }
h1 { color: #2d6a5e; text-align: center; }
h3 { margin-top: 40px; color: #4a6b67; }
.search-wrap { position: relative; margin: 16px 0 32px; }
.search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: #6b8c88; }
input { width: 100%; box-sizing: border-box; padding: 16px 16px 16px 48px; font-size: 16px; color: #1a2e2b; background: white; outline: none; border-radius: 12px; }
input::placeholder { color: #6b8c88; }

.current input { border: 1px solid #e0ebe9; }
.thick input { border: 2.5px solid #2d6a5e; }
.shadow input { border: 1px solid #e0ebe9; box-shadow: 0 4px 16px rgba(45, 106, 94, 0.12), 0 1px 4px rgba(0,0,0,0.06); }
.both input { border: 2px solid #2d6a5e; box-shadow: 0 4px 16px rgba(45, 106, 94, 0.12), 0 1px 4px rgba(0,0,0,0.06); }

.label { display: inline-block; background: #e0ebe9; color: #2d6a5e; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
</style>
</head><body>
<h1>🔍 Search Bar Options</h1>

<h3><span class="label">A — Current</span></h3>
<div class="search-wrap current">
<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
<input type="text" placeholder="Search tests, CPT codes, or symptoms...">
</div>

<h3><span class="label">B — Thick sage border</span></h3>
<div class="search-wrap thick">
<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
<input type="text" placeholder="Search tests, CPT codes, or symptoms...">
</div>

<h3><span class="label">C — Drop shadow</span></h3>
<div class="search-wrap shadow">
<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
<input type="text" placeholder="Search tests, CPT codes, or symptoms...">
</div>

<h3><span class="label">D — Both (thick border + shadow)</span></h3>
<div class="search-wrap both">
<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
<input type="text" placeholder="Search tests, CPT codes, or symptoms...">
</div>

</body></html>
